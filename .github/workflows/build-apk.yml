name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/*.apk release-output/RegionalAnatomy.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RegionalAnatomy.apk
          path: release-output/RegionalAnatomy.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0
          name: "局部解剖学数字化交互学习系统 v1.0"
          body: |
            ### 局部解剖学数字化交互学习系统 (Regional Anatomy Interactive Suite)

            **安卓端安装包直接下载**：
            点击下方 **Assets** 列表中的 `RegionalAnatomy.apk` 即可直接下载并安装至安卓手机或平板。

            **核心功能**：
            - 基础精要闪卡：264 张核心考点卡（Anki 模式，支持艾宾浩斯复习评级与快捷键）
            - 全景思维导图：8 大解剖分区，264 闪卡考点 100% 结构化映射入网与双向直通
            - 题库测评系统：1,281 道精选题库（含脊柱区深度扩补，做题与考点双向穿梭）
            - 临床病例研析：143 例经典病例（回忆构思-权威解析展开）
            - 纯前端架构，支持 100% 离线脱网使用
          draft: false
          prerelease: false
          files: release-output/RegionalAnatomy.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
